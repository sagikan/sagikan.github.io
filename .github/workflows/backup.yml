name: Database Backup

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backup
  cancel-in-progress: false

env:
  PG_VERSION: 18
  KEEP_DAYS: 30

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Install the matching pg_dump
        run: |
          sudo apt-get install -y postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y "postgresql-client-${PG_VERSION}"

      - name: Check out the private backup repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ vars.BACKUP_REPO }}
          ssh-key: ${{ secrets.BACKUP_DEPLOY_KEY }}
          path: backups

      - name: Dump and encrypt the database
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          set -euo pipefail
          bin="/usr/lib/postgresql/${PG_VERSION}/bin"

          base=$(printf '%s' "$DATABASE_URL" | sed -E 's/([?&])(sslmode|sslrootcert)=[^&]*&?/\1/g; s/[?&]$//')
          sep=$([[ "$base" == *\?* ]] && echo '&' || echo '?')
          url="${base}${sep}sslmode=verify-full&sslrootcert=system"

          if ! "$bin/psql" "$url" -XAtqc 'SELECT 1' > /dev/null 2> ssl-check.log; then
            echo "::error title=Database certificate not verified::$(head -c 300 ssl-check.log | tr '\n' ' ')"
            exit 1
          fi
          rm -f ssl-check.log

          file="backups/job-tracker-$(date -u +%Y-%m-%d_%H%M).sql.gz.gpg"
          "$bin/pg_dump" --no-owner --no-privileges "$url" \
            | gzip \
            | gpg --batch --yes --pinentry-mode loopback --symmetric --cipher-algo AES256 \
                --passphrase "$BACKUP_PASSPHRASE" --output "$file"
          test -s "$file"

      - name: Delete old backups and push
        working-directory: backups
        run: |
          set -euo pipefail
          cutoff=$(date -u -d "-${KEEP_DAYS} days" +%Y-%m-%d)
          for old in job-tracker-*.sql.gz.gpg; do
            [[ -e "$old" ]] || continue
            day="${old#job-tracker-}"; day="${day%%_*}"
            if [[ "$day" < "$cutoff" ]]; then git rm -q "$old"; fi
          done
          git config user.name "backup-bot"
          git config user.email "backup-bot@users.noreply.github.com"
          git add -A
          git commit -m "Backup $(date -u +%Y-%m-%d)"
          git push
